version: '3.8'
services:
  db:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\"" ]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MONGODB_URL=mongodb://db:27017
      - MONGODB_DB=connect4
    ports:
      - "4000:4000"

  client:
    build: ./client
    ports:
      - "3000:3000"

volumes:
  db-data:
